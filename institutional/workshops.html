<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshops | SkillBridge Institution</title>
  <link rel="stylesheet" href="css/edubridge.css">
</head>
<body>
<div class="app">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">
      <div class="section-head mb-6">
        <div>
          <div class="section-title">Workshops &amp; Industry Programs</div>
          <div class="section-subtitle">Hands-on workshops, technical sessions, and industry-led programs</div>
        </div>
      </div>
      <div class="search-filter-bar">
        <div class="search-main">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Search workshops..." aria-label="Search">
        </div>
        <select class="filter-select" id="modeFilter"><option value="">All Modes</option><option>Online</option><option>On-site</option><option>Hybrid</option></select>
        <select class="filter-select" id="certFilter"><option value="">All</option><option value="cert">With Certificate</option></select>
      </div>
      <div class="grid-auto" id="workshopCards"></div>
    </main>
  </div>
</div>
<nav class="mobile-nav"><div class="mobile-nav-inner" id="mobileNav"></div></nav>

<div class="modal-overlay" id="wsModal">
  <div class="modal" style="max-width:600px">
    <div class="modal-header"><div class="modal-title" id="wsModalTitle">Workshop Details</div>
      <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="wsModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="wsRegBtn">Register Now</button>
    </div>
  </div>
</div>

<script type="module">
import { getSidebarHTML, getTopbarHTML, getMobileNavHTML, initSidebarToggle, showToast } from "./js/ui.js";
import { getWorkshops } from "./js/services.js";
import { requireFacultyAuth, logoutFaculty } from "./js/auth-guard.js";

document.getElementById("sidebar").innerHTML = getSidebarHTML("workshops");
document.getElementById("topbar").innerHTML = getTopbarHTML("Workshops");
document.getElementById("mobileNav").innerHTML = getMobileNavHTML("opportunities");
initSidebarToggle();

let workshops = [];
async function init() {
  try { await requireFacultyAuth(); } catch(e) {}
  workshops = await getWorkshops();
  render(workshops);
  document.getElementById("searchInput").addEventListener("input", filter);
  document.getElementById("modeFilter").addEventListener("change", filter);
  document.getElementById("certFilter").addEventListener("change", filter);
  document.getElementById("logoutBtn").addEventListener("click", async () => await logoutFaculty());
}

function filter() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  const mode = document.getElementById("modeFilter").value;
  const cert = document.getElementById("certFilter").value;
  let items = workshops;
  if (q) items = items.filter(i => i.title.toLowerCase().includes(q) || i.organizer.toLowerCase().includes(q));
  if (mode) items = items.filter(i => i.mode === mode);
  if (cert === "cert") items = items.filter(i => i.certificate);
  render(items);
}

function render(items) {
  const c = document.getElementById("workshopCards");
  if (!items.length) {
    c.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div><div class="empty-title">No workshops found</div><div class="empty-desc">Try adjusting your filters.</div></div>`;
    return;
  }
  c.innerHTML = items.map(item => `
    <div class="opp-card">
      <div class="opp-header">
        <div class="flex items-center gap-3">
          <div class="opp-org-logo">${item.orgInitials}</div>
          <div><div class="opp-title">${item.title}</div><div class="opp-org">${item.organizer}</div></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">
          ${item.certificate ? '<span class="badge badge-success">Certificate</span>' : '<span class="badge badge-gray">No Cert</span>'}
          <span class="badge badge-navy" style="font-size:10px">${item.domain}</span>
        </div>
      </div>
      <div class="opp-meta">
        <span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${item.location}</span>
        <span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><rect x="2" y="3" width="20" height="14" rx="2"/></svg>${item.mode}</span>
        <span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${item.duration}</span>
      </div>
      <div class="opp-skills">${item.skills.map(s=>`<span class="skill-tag">${s}</span>`).join("")}</div>
      <div class="opp-footer">
        <span class="deadline-text">📅 ${item.deadline}</span>
        <button class="btn btn-primary btn-sm" onclick="openDetail('${item.id}')">Register</button>
      </div>
    </div>`).join("");
}

window.openDetail = function(id) {
  const item = workshops.find(w => w.id === id);
  if (!item) return;
  document.getElementById("wsModalTitle").textContent = item.title;
  document.getElementById("wsModalBody").innerHTML = `
    <div class="flex items-center gap-3 mb-4">
      <div style="width:50px;height:50px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff">${item.orgInitials}</div>
      <div><div style="font-size:15px;font-weight:700">${item.organizer}</div><div style="font-size:12px;color:var(--gray-500)">${item.location} · ${item.mode} · ${item.duration}</div></div>
    </div>
    <p style="font-size:13px;color:var(--gray-600);margin-bottom:16px;line-height:1.7">${item.description}</p>
    <div style="margin-bottom:14px"><div style="font-size:12px;font-weight:700;color:var(--gray-700);margin-bottom:8px">SKILLS COVERED</div><div class="opp-skills">${item.skills.map(s=>`<span class="skill-tag">${s}</span>`).join("")}</div></div>
    <div style="padding:12px;background:#fef3c7;border-radius:8px;border:1px solid #fcd34d;margin-top:12px">
      <div style="font-size:12px;font-weight:700;color:var(--warning)">Registration Deadline</div>
      <div style="font-size:14px;font-weight:700;color:var(--gray-800)">${item.deadline}</div>
    </div>`;
  document.getElementById("wsRegBtn").onclick = () => { showToast("Registered for " + item.title, "success"); closeModal(); };
  document.getElementById("wsModal").classList.add("open");
};

window.closeModal = () => document.getElementById("wsModal").classList.remove("open");
init().catch(console.error);
</script>
</body>
</html>
