<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Internships | EduBridge</title>
  <link rel="stylesheet" href="css/edubridge.css">
</head>
<body>
<div class="app">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="page-content">

      <div class="section-head mb-6">
        <div>
          <div class="section-title">Faculty Industry Internships</div>
          <div class="section-subtitle">Gain hands-on industry experience and real-world project exposure</div>
        </div>
      </div>

      <!-- SEARCH & FILTER -->
      <div class="search-filter-bar">
        <div class="search-main">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Search by role, organization, or domain..." aria-label="Search internships">
        </div>
        <select class="filter-select" id="modeFilter" aria-label="Mode">
          <option value="">All Modes</option>
          <option>Online</option>
          <option>On-site</option>
          <option>Hybrid</option>
          <option>Remote</option>
        </select>
        <select class="filter-select" id="domainFilter" aria-label="Domain">
          <option value="">All Domains</option>
          <option>Artificial Intelligence</option>
          <option>Data Science</option>
          <option>Product & AI</option>
          <option>Cloud Computing</option>
        </select>
      </div>

      <div class="grid-auto" id="internshipCards">
        <!-- Rendered by JS -->
      </div>

    </main>
  </div>
</div>

<nav class="mobile-nav"><div class="mobile-nav-inner" id="mobileNav"></div></nav>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal" style="max-width:640px">
    <div class="modal-header">
      <div class="modal-title" id="modalOrgTitle">Internship Details</div>
      <button class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalContent"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Close</button>
      <button class="btn btn-teal" id="saveBtn">Save Opportunity</button>
      <button class="btn btn-primary" id="applyBtn">Apply Now</button>
    </div>
  </div>
</div>

<script type="module">
import { getSidebarHTML, getTopbarHTML, getMobileNavHTML, initSidebarToggle, showToast } from "./js/ui.js";
import { getFacultyInternships, applyForFacultyOpportunity } from "./js/services.js";
import { requireFacultyAuth, logoutFaculty } from "./js/auth-guard.js";

document.getElementById("sidebar").innerHTML = getSidebarHTML("internships");
document.getElementById("topbar").innerHTML = getTopbarHTML("Faculty Internships");
document.getElementById("mobileNav").innerHTML = getMobileNavHTML("opportunities");
initSidebarToggle();

let internships = [];

async function init() {
  try { await requireFacultyAuth(); } catch(e) {}
  internships = await getFacultyInternships();
  render(internships);

  document.getElementById("searchInput").addEventListener("input", filter);
  document.getElementById("modeFilter").addEventListener("change", filter);
  document.getElementById("domainFilter").addEventListener("change", filter);
  document.getElementById("logoutBtn").addEventListener("click", async () => await logoutFaculty());
}

function filter() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  const mode = document.getElementById("modeFilter").value;
  const domain = document.getElementById("domainFilter").value;
  let items = internships;
  if (q) items = items.filter(i => i.title.toLowerCase().includes(q) || i.organization.toLowerCase().includes(q) || i.domain.toLowerCase().includes(q));
  if (mode) items = items.filter(i => i.mode === mode);
  if (domain) items = items.filter(i => i.domain === domain);
  render(items);
}

function render(items) {
  const c = document.getElementById("internshipCards");
  if (!items.length) {
    c.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></div>
      <div class="empty-title">No internships found</div>
      <div class="empty-desc">No faculty internships match your current filters.</div>
      <button class="btn btn-primary" onclick="document.getElementById('searchInput').value='';filter()">Clear Filters</button>
    </div>`;
    return;
  }

  c.innerHTML = items.map(item => `
    <div class="opp-card">
      <div class="opp-header">
        <div class="flex items-center gap-3">
          <div class="opp-org-logo">${item.orgInitials}</div>
          <div>
            <div class="opp-title">${item.title}</div>
            <div class="opp-org">${item.organization}</div>
          </div>
        </div>
        <span class="badge badge-teal">${item.match}% Match</span>
      </div>
      <div class="opp-meta">
        <span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${item.location}</span>
        <span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><rect x="2" y="3" width="20" height="14" rx="2"/></svg>${item.mode}</span>
        <span class="meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${item.duration}</span>
        <span class="badge badge-navy">${item.domain}</span>
      </div>
      <div class="opp-skills">${item.expertise.map(s=>`<span class="skill-tag">${s}</span>`).join("")}</div>
      <div class="opp-meta" style="justify-content:space-between">
        <span style="font-size:12px;color:var(--success);font-weight:600">💰 ${item.stipend}</span>
        <span class="deadline-text">📅 ${item.deadline}</span>
      </div>
      <div class="opp-footer">
        <button class="btn btn-outline btn-sm" onclick="openDetail('${item.id}')">View Details</button>
        <button class="btn btn-primary btn-sm" onclick="openDetail('${item.id}')">Apply Now</button>
      </div>
    </div>`).join("");
}

window.openDetail = function(id) {
  const item = internships.find(i => i.id === id);
  if (!item) return;
  document.getElementById("modalOrgTitle").textContent = item.title;
  document.getElementById("modalContent").innerHTML = `
    <div class="flex items-center gap-3 mb-4">
      <div style="width:50px;height:50px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff">${item.orgInitials}</div>
      <div>
        <div style="font-size:16px;font-weight:700;color:var(--gray-900)">${item.organization}</div>
        <div style="font-size:12px;color:var(--gray-500)">${item.location} · ${item.mode} · ${item.duration}</div>
      </div>
    </div>
    <p style="font-size:13px;color:var(--gray-600);margin-bottom:16px;line-height:1.7">${item.description}</p>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px">
      <div style="padding:12px;background:var(--gray-50);border-radius:8px"><div style="font-size:11px;color:var(--gray-400);font-weight:600;margin-bottom:2px">DOMAIN</div><div style="font-size:13px;font-weight:600;color:var(--navy)">${item.domain}</div></div>
      <div style="padding:12px;background:var(--gray-50);border-radius:8px"><div style="font-size:11px;color:var(--gray-400);font-weight:600;margin-bottom:2px">STIPEND</div><div style="font-size:13px;font-weight:600;color:var(--success)">${item.stipend}</div></div>
      <div style="padding:12px;background:var(--gray-50);border-radius:8px"><div style="font-size:11px;color:var(--gray-400);font-weight:600;margin-bottom:2px">DURATION</div><div style="font-size:13px;font-weight:600;color:var(--gray-800)">${item.duration}</div></div>
      <div style="padding:12px;background:var(--gray-50);border-radius:8px"><div style="font-size:11px;color:var(--gray-400);font-weight:600;margin-bottom:2px">DEADLINE</div><div style="font-size:13px;font-weight:600;color:var(--error)">${item.deadline}</div></div>
    </div>
    <div style="margin-bottom:14px"><div style="font-size:12px;font-weight:700;color:var(--gray-700);margin-bottom:8px">REQUIRED EXPERTISE</div><div class="opp-skills">${item.expertise.map(s=>`<span class="skill-tag">${s}</span>`).join("")}</div></div>
    <div><div style="font-size:12px;font-weight:700;color:var(--gray-700);margin-bottom:8px">LEARNING OUTCOMES</div>${item.outcomes.map(o=>`<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:6px"><span style="color:var(--success);font-size:14px">✓</span><span style="font-size:13px;color:var(--gray-600)">${o}</span></div>`).join("")}</div>`;

  document.getElementById("applyBtn").onclick = () => {
    showToast("Application submitted for " + item.title, "success");
    closeModal();
  };
  document.getElementById("saveBtn").onclick = () => {
    showToast("Opportunity saved!", "info");
  };
  document.getElementById("detailModal").classList.add("open");
};

window.closeModal = () => document.getElementById("detailModal").classList.remove("open");

init().catch(console.error);
</script>
</body>
</html>
