<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | SkillBridge Institution</title>
  <link rel="stylesheet" href="css/edubridge.css">
</head>
<body>
<div class="app">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="page-content">

      <div class="section-head mb-6">
        <div>
          <div class="section-title">Notifications</div>
          <div class="section-subtitle" id="unreadCount">3 unread notifications</div>
        </div>
        <button class="btn btn-outline btn-sm" id="markAllReadBtn">Mark All as Read</button>
      </div>

      <!-- CATEGORY FILTER -->
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px" id="notifChips">
        <button class="btn btn-primary btn-sm" data-cat="all">All</button>
        <button class="btn btn-outline btn-sm" data-cat="opportunity">Opportunities</button>
        <button class="btn btn-outline btn-sm" data-cat="application">Applications</button>
        <button class="btn btn-outline btn-sm" data-cat="reminder">Reminders</button>
      </div>

      <!-- NOTIFICATIONS LIST -->
      <div class="card" style="padding:0;overflow:hidden">
        <div id="notifList">
          <!-- Rendered by JS -->
        </div>
      </div>

    </main>
  </div>
</div>

<nav class="mobile-nav"><div class="mobile-nav-inner" id="mobileNav"></div></nav>

<script type="module">
import { getSidebarHTML, getTopbarHTML, getMobileNavHTML, initSidebarToggle, showToast } from "./js/ui.js";
import { getNotifications, markNotificationRead } from "./js/services.js";
import { requireFacultyAuth, logoutFaculty } from "./js/auth-guard.js";

document.getElementById("sidebar").innerHTML = getSidebarHTML("notifications");
document.getElementById("topbar").innerHTML = getTopbarHTML("Notifications", 3);
document.getElementById("mobileNav").innerHTML = getMobileNavHTML("dashboard");
initSidebarToggle();

let notifications = [];

const iconSVG = {
  briefcase: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
  "check-circle": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
};

async function init() {
  try { await requireFacultyAuth(); } catch(e) {}
  notifications = await getNotifications("user_001");
  render(notifications);

  document.querySelectorAll("#notifChips button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#notifChips button").forEach(b => { b.classList.remove("btn-primary"); b.classList.add("btn-outline"); });
      btn.classList.add("btn-primary"); btn.classList.remove("btn-outline");
      const cat = btn.dataset.cat;
      if (cat === "all") { render(notifications); return; }
      const catMap = { opportunity: ["teal","amber"], application: ["green","blue"], reminder: ["amber"] };
      const filtered = notifications.filter(n => (catMap[cat] || []).includes(n.type));
      render(filtered);
    });
  });

  document.getElementById("markAllReadBtn").addEventListener("click", () => {
    notifications.forEach(n => n.unread = false);
    render(notifications);
    document.getElementById("unreadCount").textContent = "All caught up!";
    showToast("All notifications marked as read", "success");
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => await logoutFaculty());
}

function render(items) {
  const list = document.getElementById("notifList");
  if (!items.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
        <div class="empty-title">No notifications</div>
        <div class="empty-desc">You're all caught up! New notifications will appear here.</div>
      </div>`;
    return;
  }

  const unread = notifications.filter(n => n.unread).length;
  document.getElementById("unreadCount").textContent = unread > 0 ? `${unread} unread notification${unread > 1 ? "s" : ""}` : "All caught up!";

  list.innerHTML = items.map(n => `
    <div class="notif-item${n.unread ? " unread" : ""}" onclick="markRead('${n.id}')">
      <div class="notif-icon-wrap ${n.type}">${iconSVG[n.icon] || ""}</div>
      <div class="notif-content">
        <div class="notif-title">${n.title}${n.unread ? ' <span style="display:inline-block;width:7px;height:7px;background:var(--teal);border-radius:50%;margin-left:5px;vertical-align:middle"></span>' : ""}</div>
        <div class="notif-body">${n.body}</div>
        <div class="notif-time">${n.time}</div>
      </div>
    </div>`).join("");
}

window.markRead = function(id) {
  const notif = notifications.find(n => n.id === id);
  if (notif) { notif.unread = false; render(notifications); }
};

init().catch(console.error);
</script>
</body>
</html>
