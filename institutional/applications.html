<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Applications | SkillBridge Institution</title>
  <link rel="stylesheet" href="css/edubridge.css">
</head>
<body>
<div class="app">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="page-content">

      <div class="section-head mb-6">
        <div>
          <div class="section-title">My Applications</div>
          <div class="section-subtitle">Track the status of all your submitted applications</div>
        </div>
        <a href="opportunities.html" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
          Find Opportunities
        </a>
      </div>

      <!-- STATUS SUMMARY -->
      <div class="stat-grid mb-6" id="statusSummary">
        <!-- Rendered by JS -->
      </div>

      <!-- FILTER TABS -->
      <div class="tabs" id="appTabs">
        <button class="tab-btn active" data-tab="all">All</button>
        <button class="tab-btn" data-tab="Faculty Internship">Internships</button>
        <button class="tab-btn" data-tab="Industrial Training">Training</button>
        <button class="tab-btn" data-tab="FDP">FDPs</button>
        <button class="tab-btn" data-tab="Research Collaboration">Research</button>
        <button class="tab-btn" data-tab="Consultancy">Consultancy</button>
      </div>

      <!-- STATUS FILTER -->
      <div class="search-filter-bar" style="margin-bottom:20px">
        <div class="search-main">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Search applications..." aria-label="Search">
        </div>
        <select class="filter-select" id="statusFilter" aria-label="Status filter">
          <option value="">All Statuses</option>
          <option>Applied</option>
          <option>Under Review</option>
          <option>Shortlisted</option>
          <option>Accepted</option>
          <option>Completed</option>
          <option>Rejected</option>
        </select>
      </div>

      <!-- APPLICATION CARDS -->
      <div style="display:flex;flex-direction:column;gap:16px" id="appList">
        <!-- Rendered by JS -->
      </div>

    </main>
  </div>
</div>

<nav class="mobile-nav"><div class="mobile-nav-inner" id="mobileNav"></div></nav>

<!-- DETAIL MODAL (Application Timeline) -->
<div class="modal-overlay" id="appModal">
  <div class="modal" style="max-width:580px">
    <div class="modal-header">
      <div class="modal-title" id="appModalTitle">Application Details</div>
      <button class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="appModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">Close</button>
      <button class="btn btn-danger btn-sm" id="withdrawBtn">Withdraw Application</button>
    </div>
  </div>
</div>

<script type="module">
import { getSidebarHTML, getTopbarHTML, getMobileNavHTML, initSidebarToggle, statusBadge, showToast } from "./js/ui.js";
import { getFacultyApplications } from "./js/services.js";
import { requireFacultyAuth, logoutFaculty } from "./js/auth-guard.js";

document.getElementById("sidebar").innerHTML = getSidebarHTML("applications");
document.getElementById("topbar").innerHTML = getTopbarHTML("My Applications");
document.getElementById("mobileNav").innerHTML = getMobileNavHTML("applications");
initSidebarToggle();

let apps = [];
let currentTab = "all";

async function init() {
  try { await requireFacultyAuth(); } catch(e) {}
  apps = await getFacultyApplications();

  // Status summary counts
  const counts = { total: apps.length, active: 0, pending: 0, completed: 0 };
  apps.forEach(a => {
    if (["Applied", "Under Review", "Shortlisted"].includes(a.status)) counts.pending++;
    if (["Accepted", "Scheduled"].includes(a.status)) counts.active++;
    if (a.status === "Completed") counts.completed++;
  });

  document.getElementById("statusSummary").innerHTML = [
    { label: "Total Applications", value: counts.total, color: "teal" },
    { label: "Pending Review", value: counts.pending, color: "amber" },
    { label: "Active / Accepted", value: counts.active, color: "green" },
    { label: "Completed", value: counts.completed, color: "blue" }
  ].map(s => `
    <div class="stat-card">
      <div class="stat-icon ${s.color}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
      <div>
        <div class="stat-value">${s.value}</div>
        <div class="stat-label">${s.label}</div>
      </div>
    </div>`).join("");

  renderApps();

  document.querySelectorAll("#appTabs .tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#appTabs .tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentTab = btn.dataset.tab;
      renderApps();
    });
  });

  document.getElementById("searchInput").addEventListener("input", renderApps);
  document.getElementById("statusFilter").addEventListener("change", renderApps);
  document.getElementById("logoutBtn").addEventListener("click", async () => await logoutFaculty());
}

function renderApps() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  const status = document.getElementById("statusFilter").value;
  let items = apps;
  if (currentTab !== "all") items = items.filter(a => a.type === currentTab);
  if (q) items = items.filter(a => a.title.toLowerCase().includes(q) || a.organization.toLowerCase().includes(q));
  if (status) items = items.filter(a => a.status === status);

  const list = document.getElementById("appList");

  if (!items.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
        <div class="empty-title">No applications found</div>
        <div class="empty-desc">Explore opportunities that match your skills and start building your professional experience.</div>
        <a href="opportunities.html" class="btn btn-primary">Explore Opportunities</a>
      </div>`;
    return;
  }

  const statusColors = { Applied:"navy", "Under Review":"warning", Shortlisted:"teal", Interview:"purple", Accepted:"success", Completed:"gray", Rejected:"error" };

  list.innerHTML = items.map(app => `
    <div class="card" style="display:flex;align-items:center;gap:18px;padding:18px 22px">
      <div style="width:44px;height:44px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0">${(app.organization||"").slice(0,2).toUpperCase()}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:700;color:var(--gray-900)">${app.title}</div>
        <div style="font-size:12px;color:var(--gray-500);margin:2px 0">${app.organization} &nbsp;·&nbsp; <span class="badge badge-gray" style="font-size:10px">${app.type}</span></div>
        <div style="font-size:12px;color:var(--gray-400);margin-top:4px">Applied: ${app.appliedDate}</div>
        ${app.nextStep ? `<div style="font-size:12px;color:var(--teal);font-weight:600;margin-top:3px">→ Next: ${app.nextStep}</div>` : ""}
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex-shrink:0">
        <span class="badge badge-${statusColors[app.status] || "gray"}">${app.status}</span>
        <button class="btn btn-outline btn-sm" onclick="openAppDetail('${app.id}')">View</button>
      </div>
    </div>`).join("");
}

window.openAppDetail = function(id) {
  const app = apps.find(a => a.id === id);
  if (!app) return;
  document.getElementById("appModalTitle").textContent = app.title;
  document.getElementById("appModalBody").innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--gray-100)">
      <div>
        <div style="font-size:15px;font-weight:700;color:var(--gray-900)">${app.organization}</div>
        <div style="font-size:12px;color:var(--gray-400)">${app.type} · Applied ${app.appliedDate}</div>
      </div>
      ${statusBadge(app.status)}
    </div>
    ${app.nextStep ? `<div style="background:var(--teal-pale);border:1px solid var(--teal-light);border-radius:8px;padding:12px;margin-bottom:20px"><div style="font-size:12px;font-weight:700;color:var(--teal)">NEXT STEP</div><div style="font-size:13px;font-weight:600;color:var(--gray-800);margin-top:2px">${app.nextStep}</div></div>` : ""}
    <div style="font-size:13px;font-weight:700;color:var(--gray-700);margin-bottom:14px">APPLICATION TIMELINE</div>
    <div class="timeline">
      ${app.timeline.map((step, i) => `
        <div class="timeline-item">
          <div class="timeline-dot-wrap">
            <div class="timeline-dot${step.current ? " current" : step.done ? " done" : ""}"></div>
            ${i < app.timeline.length - 1 ? '<div class="timeline-line"></div>' : ""}
          </div>
          <div class="timeline-content">
            <div class="timeline-title">${step.step}${step.current ? " <span style='color:var(--teal);font-size:11px;font-weight:600'>(Current)</span>" : ""}</div>
            <div class="timeline-date">${step.date}</div>
          </div>
        </div>`).join("")}
      ${app.status !== "Completed" && app.status !== "Rejected" ? `
        <div class="timeline-item" style="opacity:.4">
          <div class="timeline-dot-wrap">
            <div class="timeline-dot"></div>
          </div>
          <div class="timeline-content">
            <div class="timeline-title">Final Decision</div>
            <div class="timeline-date">Pending</div>
          </div>
        </div>` : ""}
    </div>`;

  document.getElementById("withdrawBtn").style.display = ["Completed","Rejected"].includes(app.status) ? "none" : "block";
  document.getElementById("withdrawBtn").onclick = () => {
    showToast("Application withdrawn", "info");
    closeModal();
  };
  document.getElementById("appModal").classList.add("open");
};

window.closeModal = () => document.getElementById("appModal").classList.remove("open");
init().catch(console.error);
</script>
</body>
</html>
