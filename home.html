<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard - SkillBridge</title>

    <link rel="stylesheet"
          href="css/home.css">

</head>

<body>


<header class="navbar">

    <div class="brand">
        SkillBridge
    </div>

    <button id="logoutBtn"
            class="logout-btn">

        Logout

    </button>

</header>


<main class="dashboard">

    <section class="welcome-section">

        <p class="small-text">
            Welcome back
        </p>

        <h1 id="userName">
            Loading...
        </h1>

        <p id="userRole">
        </p>

    </section>


    <section class="stats">

        <div class="stat-card">

            <span>🎯</span>

            <h3>Skills</h3>

            <p>0</p>

        </div>


        <div class="stat-card">

            <span>💼</span>

            <h3>Applications</h3>

            <p>0</p>

        </div>


        <div class="stat-card">

            <span>🎓</span>

            <h3>Courses</h3>

            <p>0</p>

        </div>

    </section>


    <section class="quick-actions">

        <h2>Quick Actions</h2>


        <div class="action-grid">

            <div class="action-card">

                <span>👤</span>

                <h3>My Profile</h3>

                <p>
                    Complete your professional profile
                </p>

            </div>


            <div class="action-card">

                <span>🧠</span>

                <h3>Skill Assessment</h3>

                <p>
                    Assess your technical skills
                </p>

            </div>


            <div class="action-card">

                <span>💼</span>

                <h3>Internships</h3>

                <p>
                    Discover internship opportunities
                </p>

            </div>


            <div class="action-card">

                <span>🔎</span>

                <h3>Jobs</h3>

                <p>
                    Find relevant job opportunities
                </p>

            </div>

        </div>

    </section>

</main>


<script type="module"
        src="js/home.js">
</script>
<script type="module"
        src="js/ai-chatbot.js">
</script>

</body>

</html>
